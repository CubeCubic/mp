name: Generate track share pages

# Keeps t/<id>.html (per-track Open Graph preview pages, used by the
# "Share" button) in sync with the tracks stored in Firebase. Tracks are
# added/edited/deleted through the admin panel directly in Firebase, not
# through git, so this runs on a schedule instead of on push.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-share-pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate share pages
        run: node scripts/generate-share-pages.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add t/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update track share pages [skip ci]"
            git push
          fi
